<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#cardGrad)" stroke-width="6" opacity="0.4" />

  <!-- Main Wallet Card / Slate -->
  <g filter="url(#shadow)">
    <rect x="96" y="140" width="320" height="232" rx="32" fill="url(#cardGrad)" />
    
    <!-- Magnetic Stripe / Decorative band -->
    <path d="M96 195 H416 V225 H96 Z" fill="#000000" opacity="0.18" />

    <!-- Wallet Clasp / Badge -->
    <rect x="330" y="220" width="86" height="72" rx="18" fill="#1e293b" />
    <circle cx="373" cy="256" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />

    <!-- Spending Trend Growth Chart Polyline -->
    <path d="M 140 310 L 195 270 L 245 290 L 310 230" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <!-- Pulse Dots -->
    <circle cx="140" cy="310" r="7" fill="#ffffff" />
    <circle cx="195" cy="270" r="7" fill="#ffffff" />
    <circle cx="245" cy="290" r="7" fill="#ffffff" />
    <circle cx="310" cy="230" r="8" fill="#10b981" stroke="#ffffff" stroke-width="3" />

    <!-- Currency Symbol Emblem -->
    <g transform="translate(135, 155)">
      <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" opacity="0.95">$</text>
    </g>
  </g>

  <!-- Floating Green Growth Chip -->
  <g filter="url(#shadow)" transform="translate(110, 320)">
    <rect width="130" height="54" rx="27" fill="url(#emeraldGrad)" />
    <path d="M22 32 L34 20 L44 30 L58 16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M50 16 H58 V24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="70" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff">+42%</text>
  </g>
</svg>
